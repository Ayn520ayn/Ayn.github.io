&lt;style&gt;
:root{
  --orange:#FF8C42;--orange-deep:#e96825;--blue:#4A90D9;--blue-deep:#1769AA;
  --ink:#16324F;--cream:#FFF8EF;--line:rgba(22,50,79,.18);--green:#35a56c;
  --shadow:0 18px 42px rgba(22,50,79,.18);--radius:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:ui-rounded,&quot;Arial Rounded MT Bold&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#FF8C42 0%,#FFD08A 45%,#4A90D9 100%);}
body{min-height:100vh;overflow-x:hidden}
button,input{font:inherit}
button{border:0;cursor:pointer;min-height:56px;font-weight:900;letter-spacing:.02em;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:5px solid #ffe15b;outline-offset:4px}
button:disabled{cursor:not-allowed;opacity:.48;filter:saturate(.5)}
.app-shell{min-height:100vh;padding:clamp(22px,4vw,52px);position:relative;overflow:hidden}
.app-shell:before,.app-shell:after{content:&quot;&quot;;position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0}
.app-shell:before{width:35vw;height:35vw;left:-16vw;top:-15vw;background:rgba(255,255,255,.16)}
.app-shell:after{width:30vw;height:30vw;right:-10vw;bottom:-13vw;background:rgba(255,255,255,.13)}
.view{display:none;position:relative;z-index:1;min-height:calc(100vh - 2 * clamp(22px,4vw,52px));animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{text-align:center;max-width:1180px;margin:0 auto 28px}
.kicker{font-size:clamp(22px,2.2vw,32px);font-weight:900;opacity:.85;letter-spacing:.1em}
h1{font-size:clamp(44px,7vw,88px);line-height:1.05;margin:12px 0 16px;font-weight:1000;letter-spacing:-.05em}
h2{font-size:clamp(34px,4.8vw,58px);margin:0 0 20px;line-height:1.05}
h3{font-size:clamp(28px,3vw,40px);margin:0 0 14px}
.lead{font-size:clamp(24px,2.7vw,36px);line-height:1.35;margin:0 auto;max-width:900px;font-weight:800}
.panel{max-width:1180px;margin:0 auto;background:rgba(255,248,239,.9);border:3px solid rgba(255,255,255,.55);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(24px,4vw,48px);backdrop-filter:blur(8px)}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;max-width:1000px;margin:38px auto 0}
.mode-btn{min-height:230px;border-radius:34px;color:white;position:relative;overflow:hidden;padding:30px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:left;box-shadow:0 14px 0 rgba(22,50,79,.16),0 22px 36px rgba(22,50,79,.18);transition:transform .18s ease,box-shadow .18s ease}
.mode-btn:hover{transform:translateY(-6px);box-shadow:0 20px 0 rgba(22,50,79,.14),0 30px 40px rgba(22,50,79,.2)}
.mode-btn:active{transform:translateY(4px);box-shadow:0 8px 0 rgba(22,50,79,.16),0 12px 24px rgba(22,50,79,.18)}
.mode-btn.blue{background:linear-gradient(135deg,#1769AA,#4A90D9)}
.mode-btn.orange{background:linear-gradient(135deg,#e96825,#FF8C42)}
.mode-icon{font-size:78px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 7px 0 rgba(0,0,0,.12))}
.mode-title{font-size:clamp(34px,4vw,54px);line-height:1;font-weight:1000}
.mode-sub{font-size:24px;line-height:1.25;margin-top:12px;font-weight:800;opacity:.95}
.notice{font-size:22px;line-height:1.45;font-weight:800;background:#fff2d8;border:3px solid #f5bd6e;border-radius:20px;padding:18px 22px;margin-top:26px}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px}
.section-card{background:rgba(255,255,255,.68);border:3px solid rgba(255,255,255,.8);border-radius:24px;padding:24px}
.field-label{display:block;font-size:28px;font-weight:1000;margin-bottom:12px}
.name-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.name-field{display:flex;gap:12px;align-items:center}
.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:white;font-size:34px;font-weight:1000;flex:0 0 auto;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.avatar.blue{background:linear-gradient(135deg,#1769AA,#4A90D9)}
.avatar.orange{background:linear-gradient(135deg,#e96825,#FF8C42)}
input[type=text]{width:100%;min-height:62px;border:3px solid var(--line);border-radius:16px;padding:10px 16px;background:#fff;font-size:26px;font-weight:900;color:var(--ink)}
.option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.option-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.option-card{min-height:126px;border:4px solid transparent;border-radius:20px;background:#fff;display:flex;align-items:center;gap:12px;padding:16px;transition:.18s;box-shadow:0 7px 15px rgba(22,50,79,.1)}
.option-card:hover{transform:translateY(-3px)}
.option-card.selected{border-color:var(--blue-deep);background:#e9f4ff;box-shadow:0 0 0 5px rgba(74,144,217,.18)}
.option-emoji{font-size:42px;line-height:1}
.option-title{font-size:26px;font-weight:1000;line-height:1.1}
.option-desc{font-size:20px;font-weight:800;margin-top:5px;opacity:.75}
.action-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.primary-btn,.secondary-btn,.danger-btn{border-radius:18px;padding:14px 28px;font-size:30px;color:#fff;box-shadow:0 7px 0 rgba(22,50,79,.16),0 12px 18px rgba(22,50,79,.12);transition:.16s;min-width:230px}
.primary-btn{background:linear-gradient(135deg,#1769AA,#4A90D9)}
.secondary-btn{background:linear-gradient(135deg,#e96825,#FF8C42)}
.danger-btn{background:#b94242}
.primary-btn:active,.secondary-btn:active,.danger-btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(22,50,79,.16),0 5px 10px rgba(22,50,79,.12)}
.text-btn{background:transparent;color:var(--blue-deep);font-size:24px;min-height:48px;padding:5px 10px;text-decoration:underline}
.online-box{display:none;margin-top:20px;border:3px dashed var(--blue-deep);border-radius:20px;padding:20px;background:rgba(233,244,255,.8)}
.online-box.active{display:block}
.online-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.room-code{font-size:56px;letter-spacing:.18em;font-weight:1000;color:var(--blue-deep);text-align:center;background:#fff;border-radius:16px;padding:14px;margin:12px 0}
.status-line{font-size:24px;font-weight:900;line-height:1.4;min-height:34px}
.back-row{display:flex;justify-content:flex-start;margin-bottom:18px}
.game-view{padding:0;min-height:calc(100vh - 2 * clamp(22px,4vw,52px))}
.game-top{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:stretch;gap:18px;margin-bottom:22px}
.score-card{background:rgba(255,248,239,.92);border-radius:24px;padding:18px 22px;box-shadow:var(--shadow);border:3px solid rgba(255,255,255,.7);display:flex;align-items:center;gap:16px;min-width:0}
.score-card.active{outline:6px solid #ffe15b;transform:translateY(-4px)}
.score-card .score-name{font-size:clamp(25px,2.4vw,36px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-num{font-size:clamp(58px,6vw,92px);font-weight:1000;line-height:.9;margin-left:auto}
.turn-card{background:linear-gradient(135deg,#fff9ee,#fff);border-radius:24px;box-shadow:var(--shadow);padding:18px;text-align:center;border:3px solid rgba(255,255,255,.78);display:flex;flex-direction:column;justify-content:center}
.turn-title{font-size:clamp(32px,4vw,62px);font-weight:1000;line-height:1.05;color:var(--blue-deep)}
.metrics{font-size:clamp(22px,2.2vw,30px);font-weight:1000;margin-top:12px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.metric-pill{background:#e9f4ff;border-radius:999px;padding:8px 16px;white-space:nowrap}
#timer.warning{background:#ffe0de;color:#b94242;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.game-board-wrap{max-width:1320px;margin:0 auto;display:flex;justify-content:center}
.board{width:min(92vw,1180px);display:grid;gap:clamp(8px,1.25vw,16px);perspective:1300px}
.board.easy{grid-template-columns:repeat(4,1fr)}
.board.hard{grid-template-columns:repeat(6,1fr)}
.card{aspect-ratio:1/1;min-width:0;position:relative;cursor:pointer;user-select:none;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:rotateY(0deg);transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.card.flipped,.card.matched{transform:rotateY(180deg)}
.card.matched{cursor:default}
.card-face{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;border:4px solid rgba(255,255,255,.84);box-shadow:0 10px 0 rgba(22,50,79,.13),0 18px 22px rgba(22,50,79,.14);transition:opacity .08s linear,visibility 0s linear .08s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.card-back{background:linear-gradient(145deg,#1769AA,#4A90D9);color:#fff;font-size:clamp(42px,6vw,82px);text-shadow:0 5px 0 rgba(0,0,0,.13);opacity:1;visibility:visible;z-index:2}
.card-front{background:linear-gradient(145deg,#fffdf8,#ffe9bd);font-size:clamp(42px,6vw,84px);opacity:0;visibility:hidden;z-index:1;transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.card.flipped .card-back,.card.matched .card-back{opacity:0;visibility:hidden;transition-delay:0s}
.card.flipped .card-front,.card.matched .card-front{opacity:1;visibility:visible;transition-delay:0s;z-index:3}
.card.matched .card-front{box-shadow:0 0 0 8px rgba(53,165,108,.72),0 12px 0 rgba(22,50,79,.12),0 22px 30px rgba(53,165,108,.25)}
.card.shake{animation:shake .42s ease}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-10px)}50%{transform:rotateY(180deg) translateX(10px)}75%{transform:rotateY(180deg) translateX(-7px)}}
.game-footer{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:22px}
.small-note{font-size:20px;font-weight:800;opacity:.78;text-align:center;margin:14px auto 0;max-width:1100px}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:30;opacity:0;pointer-events:none;background:#16324F;color:white;border-radius:20px;padding:18px 28px;font-size:34px;font-weight:1000;box-shadow:var(--shadow);transition:.2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(22,50,79,.52);z-index:20;align-items:center;justify-content:center;padding:24px}
.modal-backdrop.show{display:flex}
.win-modal{width:min(760px,95vw);background:linear-gradient(145deg,#fffaf0,#fff);border:5px solid #ffe15b;border-radius:34px;box-shadow:0 24px 60px rgba(22,50,79,.35);padding:36px;text-align:center;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.75) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.win-cup{font-size:92px;line-height:1}
.win-title{font-size:clamp(42px,6vw,72px);font-weight:1000;color:var(--blue-deep);margin:10px 0}
.win-winner{font-size:clamp(34px,4vw,52px);font-weight:1000}
.final-score{font-size:clamp(50px,7vw,84px);font-weight:1000;color:var(--orange-deep);margin:12px 0 20px}
#celebration{position:fixed;inset:0;z-index:19;pointer-events:none}
.records-backdrop{display:none;position:fixed;inset:0;z-index:40;background:rgba(22,50,79,.62);padding:clamp(14px,3vw,38px);overflow:auto}
.records-backdrop.show{display:block}
.records-panel{width:min(1280px,100%);margin:0 auto;background:linear-gradient(145deg,#fffaf0,#eaf5ff);border:5px solid #ffe15b;border-radius:30px;box-shadow:0 24px 60px rgba(22,50,79,.35);padding:clamp(20px,3vw,36px);position:relative}
.records-close{position:absolute;right:20px;top:18px;min-width:58px;min-height:58px;border-radius:50%;background:#b94242;color:#fff;font-size:30px}
.records-title{font-size:clamp(38px,5vw,62px);margin:0 72px 6px 0;color:var(--blue-deep);font-weight:1000}.records-note{font-size:22px;font-weight:800;margin:0 0 22px}
.stats-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat-box{background:#fff;border:3px solid rgba(74,144,217,.25);border-radius:20px;padding:16px;text-align:center}.stat-label{font-size:20px;font-weight:900}.stat-value{font-size:clamp(30px,3vw,50px);font-weight:1000;color:var(--orange-deep);line-height:1.15;margin-top:6px}.record-list{max-height:42vh;overflow:auto;border:3px solid rgba(74,144,217,.28);border-radius:20px;background:#fff}.record-row{display:grid;grid-template-columns:.5fr 1.5fr .9fr .8fr 1fr .75fr auto;gap:10px;align-items:center;padding:14px 16px;border-bottom:2px solid #e6eef5;font-size:20px;font-weight:800}.record-row.head{position:sticky;top:0;background:#e9f4ff;color:var(--blue-deep);font-weight:1000}.record-empty{padding:36px;text-align:center;font-size:28px;font-weight:900}.record-delete{min-width:88px;min-height:48px;padding:8px 12px;border-radius:12px;background:#b94242;color:#fff;font-size:18px}.records-actions{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.record-row{grid-template-columns:1fr 1.3fr 1fr auto}.record-row span:nth-child(3),.record-row span:nth-child(4),.record-row span:nth-child(6){display:none}.record-row.head span:nth-child(3),.record-row.head span:nth-child(4),.record-row.head span:nth-child(6){display:none}}
@media (max-width:900px){
  .mode-grid,.setup-grid{grid-template-columns:1fr}.online-grid{grid-template-columns:1fr}.game-top{grid-template-columns:1fr;gap:10px}.score-card{padding:14px 18px}.turn-card{order:-1}.score-card .score-name{font-size:28px}.score-num{font-size:62px}.board{width:min(95vw,760px);gap:8px}.card-face{border-radius:12px;border-width:3px}.game-footer button{min-width:180px}
}
@media (max-width:560px){
  .app-shell{padding:16px}.panel{padding:20px;border-radius:22px}.name-row,.option-grid,.option-grid.two{grid-template-columns:1fr}.mode-btn{min-height:190px;padding:22px}.mode-icon{font-size:60px}.mode-sub{font-size:20px}.notice{font-size:18px}.field-label{font-size:24px}.option-card{min-height:90px}.option-title{font-size:22px}.option-desc{font-size:16px}.primary-btn,.secondary-btn,.danger-btn{width:100%;font-size:26px}.game-view{min-height:auto}.turn-title{font-size:34px}.metrics{font-size:20px;gap:8px}.metric-pill{padding:7px 10px}.score-card{min-height:92px}.card-face{font-size:38px}.win-modal{padding:24px 16px}.win-cup{font-size:72px}
}

  function openRecords(){renderRecords();$('#recordsBackdrop').classList.add('show')}

  function deleteRecord(id){setRecords(getRecords().filter(r=&gt;String(r.id)!==String(id)));renderRecords()}
  function csvEscape(value){const text=String(value??'');return /[&quot;,\n]/.test(text)?`&quot;${text.replace(/&quot;/g,'&quot;&quot;')}&quot;`:text}
  function exportRecords(){const rows=getRecords().sort((a,b)=&gt;new Date(b.datetime)-new Date(a.datetime));const headers=['对局编号','日期时间','游戏模式','主题','难度','玩家1','玩家2','最终比分','获胜方','总用时(秒)','总翻牌次数'];const content='\ufeff'+[headers,...rows.map(r=&gt;[r.no,formatDateTime(r.datetime),r.mode,r.theme,r.difficulty,r.player1,r.player2,r.score,r.winner,r.seconds,r.flips])].map(row=&gt;row.map(csvEscape).join(',')).join('\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PK战绩记录.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
  function updateMetrics(){

  }

  function finishGame(){

  }
  function renderWin(){

    $('#winTitle').textContent=title; $('#winWinner').textContent=state.winner===null?'两位选手都很棒！':`🏆 ${state.players[state.winner].name}`; $('#finalScore').textContent=`${a.score} : ${b.score}`; $('#winBackdrop').classList.add('show'); launchCelebration();
  }
  function hideWin(){ $('#winBackdrop').classList.remove('show'); stopCelebration(); }
  function launchCelebration(){
    const canvas=$('#celebration'); const ctx=canvas.getContext('2d'); canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.scale(devicePixelRatio,devicePixelRatio);
    const colors=['#FF8C42','#4A90D9','#FFE15B','#35A56C','#F66D9B','#FFFFFF']; const particles=Array.from({length:170},()=&gt;({x:Math.random()*innerWidth,y:-Math.random()*innerHeight,w:5+Math.random()*10,h:7+Math.random()*15,c:colors[Math.floor(Math.random()*colors.length)],vy:2+Math.random()*4,vx:-1.5+Math.random()*3,r:Math.random()*Math.PI,vr:-.12+Math.random()*.24,star:Math.random()&gt;.72})); celebrationStopAt=performance.now()+5000;

  }
  function stopCelebration(){if(celebrationFrame)cancelAnimationFrame(celebrationFrame);celebrationFrame=null;const c=$('#celebration');c.getContext('2d')?.clearRect(0,0,c.width,c.height)}
  function resetToSetup(keepSettings){
    hideWin(); stopTimer(); const keep={mode:state.mode,role:state.role,room:state.room,hostId:state.hostId,guestId:state.guestId,onlineConnected:state.onlineConnected,theme:state.theme,difficulty:state.difficulty,players:state.players.map(p=&gt;({...p,score:0}))}; state=keepSettings?{...structuredClone(defaultState),...keep,phase:'setup'}:{...structuredClone(defaultState),mode:state.mode,role:state.role,phase:'setup'}; localRole=state.mode==='same'?'solo':localRole; $('#blueName').value=state.players[0].name;$('#orangeName').value=state.players[1].name;showView('#setupView');updateSetup();

  function openRoom(code){

  }
  function bind(){
    $('#sameScreenBtn').onclick=()=&gt;{closeRoom();localRole='solo';state={...structuredClone(defaultState),mode:'same',role:'solo'};showView('#setupView');updateSetup()};
    $('#onlineBtn').onclick=()=&gt;{closeRoom();localRole='guest';state={...structuredClone(defaultState),mode:'online',role:'guest'};showView('#setupView');updateSetup()};
    $('#backToModeBtn').onclick=()=&gt;{closeRoom();stopTimer();state=structuredClone(defaultState);showView('#modeView')};
    $$('.option-card[data-theme]').forEach(b=&gt;b.onclick=()=&gt;{state.theme=b.dataset.theme;updateSetup()});
    $$('.option-card[data-difficulty]').forEach(b=&gt;b.onclick=()=&gt;{state.difficulty=b.dataset.difficulty;updateSetup()});
    $('#createRoomBtn').onclick=createRoom;$('#joinRoomBtn').onclick=joinRoom;
    $('#recordsBtn').onclick=openRecords;$('#closeRecordsBtn').onclick=closeRecords;
    $('#recordsBackdrop').addEventListener('click',e=&gt;{if(e.target===e.currentTarget)closeRecords();const del=e.target.closest('[data-record-id]');if(del)deleteRecord(del.dataset.recordId)});
    $('#clearRecordsBtn').onclick=()=&gt;{if(confirm('确定清空全部PK战绩吗？此操作无法恢复。')){setRecords([]);renderRecords();showToast('已清空全部战绩')}};
    $('#exportRecordsBtn').onclick=exportRecords;
    $('#startGameBtn').onclick=()=&gt;{if(state.mode==='online'){if(localRole!=='host'||!state.onlineConnected){showToast('请先创建房间并等待对手加入');return}startFreshGame()}else{startFreshGame()}};
    $('#board').addEventListener('click',e=&gt;{const card=e.target.closest('.card');if(card)handleCardClick(Number(card.dataset.index))});
    $('#quitGameBtn').onclick=()=&gt;{if(confirm('确定退出当前牌局吗？')){if(state.mode==='online'&amp;&amp;localRole==='host'){state.phase='setup';syncStateIfHost()}resetToSetup(true)}};
    $('#soundBtn').onclick=()=&gt;{soundOn=!soundOn;$('#soundBtn').textContent=`声音：${soundOn?'开':'关'}`};
    $('#newRoundBtn').onclick=()=&gt;{hideWin();if(state.mode==='online'&amp;&amp;localRole==='guest'){showToast('等待房主开始新牌局');return}showView('#setupView');if(state.mode==='online')updateSetup();else updateSetup()};
    $('#rematchBtn').onclick=()=&gt;{hideWin();if(state.mode==='online'&amp;&amp;localRole==='guest'){showToast('等待房主重新匹配');return}startFreshGame()};
    window.addEventListener('beforeunload',()=&gt;{roomChannel?.close();stopTimer()});
  }
  bind(); updateSetup();
})();
